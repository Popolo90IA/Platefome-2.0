<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120">
  <defs>
    <linearGradient id="wm-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(38,65%,58%)"/>
      <stop offset="1" stop-color="hsl(28,62%,42%)"/>
    </linearGradient>
    <linearGradient id="wm-bronze" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="hsl(28,62%,38%)"/>
      <stop offset="1" stop-color="hsl(22,70%,50%)"/>
    </linearGradient>
  </defs>

  <!-- Cloche icon (60×60, centré verticalement) -->
  <!-- Tray -->
  <line x1="4" y1="88" x2="64" y2="88" stroke="url(#wm-gold)" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="4" y="88" width="60" height="5" rx="2.5" fill="none" stroke="url(#wm-gold)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Dome -->
  <path d="M 7 88 Q 7 32 34 32 Q 61 32 61 88 Z" fill="none" stroke="url(#wm-gold)" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Handle -->
  <circle cx="34" cy="26" r="7" fill="none" stroke="url(#wm-gold)" stroke-width="3.5"/>
  <!-- Wave 1 -->
  <path d="M 12 72 C 20 62, 28 62, 34 72 C 40 82, 48 82, 56 72" fill="none" stroke="url(#wm-gold)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Wave 2 -->
  <path d="M 12 82 C 20 72, 28 72, 34 82 C 40 92, 48 92, 56 82" fill="none" stroke="url(#wm-gold)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Sparkle dots -->
  <circle cx="20" cy="42" r="2.5" fill="url(#wm-gold)"/>
  <circle cx="10" cy="58" r="2"   fill="url(#wm-gold)"/>
  <circle cx="54" cy="48" r="2"   fill="url(#wm-gold)"/>

  <!-- Wordmark text -->
  <text x="80" y="80" font-family="Cormorant Garamond, Georgia, serif" font-weight="500" font-size="62" fill="hsl(24,18%,16%)" letter-spacing="-0.02em">Plate<tspan font-style="italic" fill="url(#wm-bronze)">form</tspan></text>
</svg>
