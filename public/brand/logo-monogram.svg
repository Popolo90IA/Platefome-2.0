<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="mn-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(38,65%,58%)"/>
      <stop offset="1" stop-color="hsl(28,62%,42%)"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="200" height="200" rx="36" fill="#0d0c0b"/>

  <!-- Tray -->
  <rect x="24" y="134" width="152" height="6" rx="3" fill="none" stroke="url(#mn-gold)" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="134" x2="170" y2="134" stroke="url(#mn-gold)" stroke-width="3" stroke-linecap="round"/>

  <!-- Dome -->
  <path d="M 34 134 Q 34 60 100 60 Q 166 60 166 134 Z"
    fill="none" stroke="url(#mn-gold)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Handle -->
  <circle cx="100" cy="54" r="9" fill="none" stroke="url(#mn-gold)" stroke-width="3"/>

  <!-- Wave 1 -->
  <path d="M 44 112 C 62 96, 82 96, 100 112 C 118 128, 138 128, 156 112"
    fill="none" stroke="url(#mn-gold)" stroke-width="3" stroke-linecap="round"/>
  <!-- Wave 2 -->
  <path d="M 44 124 C 62 108, 82 108, 100 124 C 118 140, 138 140, 156 124"
    fill="none" stroke="url(#mn-gold)" stroke-width="3" stroke-linecap="round"/>

  <!-- Sparkle dots -->
  <circle cx="68"  cy="76" r="3" fill="url(#mn-gold)"/>
  <circle cx="48"  cy="98" r="2.5" fill="url(#mn-gold)"/>
  <circle cx="148" cy="84" r="2.5" fill="url(#mn-gold)"/>
</svg>
