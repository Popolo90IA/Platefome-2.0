    <text x="90" y="120" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-style="italic" font-weight="500" font-size="92" fill="url(#lk-bronze)" letter-spacing="-0.04em">P</text>
    <path d="M 158 80 L 168 88 L 162 96" fill="none" stroke="url(#lk-bronze)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
  </g>

  
  <text x="220" y="128" font-family="Cormorant Garamond, Georgia, serif" font-weight="500" font-size="84" fill="hsl(24,18%,16%)" letter-spacing="-0.02em">Plate<tspan font-style="italic" fill="url(#lk-bronze)">form</tspan></text>

  
  <text x="222" y="160" font-family="DM Mono, ui-monospace, monospace" font-size="13" letter-spacing="3.5" fill="hsl(24,12%,38%)">EVERY DISH · IN 360°</text>
