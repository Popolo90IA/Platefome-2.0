      <stop offset="0" stop-color="hsl(28, 62%, 38%)"></stop>
      <stop offset="1" stop-color="hsl(22, 70%, 50%)"></stop>
    </linearGradient>
    <radialGradient id="lk-plate" cx="0.4" cy="0.32" r="0.75">
      <stop offset="0" stop-color="hsl(38, 32%, 99%)"></stop>
      <stop offset="0.7" stop-color="hsl(38, 28%, 94%)"></stop>
      <stop offset="1" stop-color="hsl(30, 20%, 84%)"></stop>
    </radialGradient>
  </defs>

  
  <g transform="translate(20,20)">
    <circle cx="90" cy="90" r="86" fill="none" stroke="url(#lk-bronze)" stroke-width="1" stroke-dasharray="1 5" opacity="0.45"></circle>
    <circle cx="90" cy="96" r="72" fill="hsl(24,18%,16%)" opacity="0.06"></circle>
    <circle cx="90" cy="90" r="72" fill="url(#lk-plate)" stroke="hsl(30,18%,82%)" stroke-width="1"></circle>
