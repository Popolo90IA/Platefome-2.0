<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <linearGradient id="lk-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(38,65%,58%)"/>
      <stop offset="1" stop-color="hsl(28,62%,42%)"/>
    </linearGradient>
    <linearGradient id="lk-bronze" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="hsl(28,62%,38%)"/>
      <stop offset="1" stop-color="hsl(22,70%,50%)"/>
    </linearGradient>
  </defs>

  <!-- Cloche icon (180×180, centré sur y=110) -->
  <g transform="translate(20, 10)">
    <!-- Tray -->
    <line x1="0" y1="170" x2="160" y2="170" stroke="url(#lk-gold)" stroke-width="6" stroke-linecap="round"/>
    <rect x="0" y="170" width="160" height="10" rx="5" fill="none" stroke="url(#lk-gold)" stroke-width="6" stroke-linecap="round"/>
    <!-- Dome -->
    <path d="M 5 170 Q 5 40 80 40 Q 155 40 155 170 Z" fill="none" stroke="url(#lk-gold)" stroke-width="6" stroke-linejoin="round"/>
    <!-- Handle -->
    <circle cx="80" cy="30" r="14" fill="none" stroke="url(#lk-gold)" stroke-width="6"/>
    <!-- Wave 1 -->
    <path d="M 20 130 C 38 108, 62 108, 80 130 C 98 152, 122 152, 140 130" fill="none" stroke="url(#lk-gold)" stroke-width="6" stroke-linecap="round"/>
    <!-- Wave 2 -->
    <path d="M 20 152 C 38 130, 62 130, 80 152 C 98 174, 122 174, 140 152" fill="none" stroke="url(#lk-gold)" stroke-width="6" stroke-linecap="round"/>
    <!-- Sparkle dots -->
    <circle cx="38"  cy="62"  r="5" fill="url(#lk-gold)"/>
    <circle cx="10"  cy="100" r="4" fill="url(#lk-gold)"/>
    <circle cx="144" cy="78"  r="4" fill="url(#lk-gold)"/>
  </g>

  <!-- Wordmark -->
  <text x="222" y="130" font-family="Cormorant Garamond, Georgia, serif" font-weight="500" font-size="84" fill="hsl(24,18%,16%)" letter-spacing="-0.02em">Plate<tspan font-style="italic" fill="url(#lk-bronze)">form</tspan></text>

  <!-- Tagline -->
  <text x="224" y="163" font-family="DM Mono, ui-monospace, monospace" font-size="13" letter-spacing="3.5" fill="hsl(24,12%,38%)">EVERY DISH · IN 360°</text>
</svg>
