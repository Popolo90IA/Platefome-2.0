<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <linearGradient id="lk-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(38,65%,58%)"/>
      <stop offset="100%" stop-color="hsl(28,62%,42%)"/>
    </linearGradient>
    <linearGradient id="lk-bronze" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="hsl(28,62%,38%)"/>
      <stop offset="100%" stop-color="hsl(22,70%,50%)"/>
    </linearGradient>
  </defs>

  <!-- Plate icon — outer rim -->
  <circle cx="110" cy="110" r="100" fill="none" stroke="url(#lk-gold)" stroke-width="5"/>
  <!-- Plate inner rim -->
  <circle cx="110" cy="110" r="84" fill="none" stroke="url(#lk-gold)" stroke-width="2" opacity="0.5"/>
  <!-- P letter -->
  <text x="110" y="158" font-family="Cormorant Garamond, Georgia, serif" font-size="130" font-style="italic" font-weight="600" text-anchor="middle" fill="url(#lk-gold)">P</text>

  <!-- Wordmark -->
  <text x="240" y="130" font-family="Cormorant Garamond, Georgia, serif" font-weight="500" font-size="84" fill="hsl(24,18%,16%)" letter-spacing="-0.02em">Plate<tspan font-style="italic" fill="url(#lk-bronze)">form</tspan></text>

  <!-- Tagline -->
  <text x="242" y="163" font-family="DM Mono, ui-monospace, monospace" font-size="13" letter-spacing="3.5" fill="hsl(24,12%,38%)">EVERY DISH · IN 360°</text>
</svg>
