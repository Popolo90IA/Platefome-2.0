<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(38,65%,58%)"/>
      <stop offset="1" stop-color="hsl(28,62%,42%)"/>
    </linearGradient>
  </defs>

  <!-- Tray base -->
  <rect x="48" y="268" width="304" height="10" rx="5" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <!-- Tray line -->
  <line x1="60" y1="268" x2="340" y2="268" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>

  <!-- Cloche dome -->
  <path d="M 68 268 Q 68 120 200 120 Q 332 120 332 268 Z"
    fill="none" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>

  <!-- Handle ring -->
  <circle cx="200" cy="112" r="16" fill="none" stroke="url(#gold)" stroke-width="5"/>

  <!-- Infinity / wave motif (3 waves) -->
  <!-- Wave 1 (top) -->
  <path d="M 90 224 C 120 196, 160 196, 200 224 C 240 252, 280 252, 310 224"
    fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <!-- Wave 2 (middle) -->
  <path d="M 90 244 C 120 216, 160 216, 200 244 C 240 272, 280 272, 310 244"
    fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <!-- Wave 3 (bottom) -->
  <path d="M 90 264 C 120 236, 160 236, 200 264 C 240 292, 280 292, 310 264"
    fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>

  <!-- Sparkle dots -->
  <circle cx="136" cy="152" r="5" fill="url(#gold)"/>
  <circle cx="96"  cy="196" r="4" fill="url(#gold)"/>
  <circle cx="296" cy="168" r="4" fill="url(#gold)"/>
</svg>
