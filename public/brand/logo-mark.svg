<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(28,62%,38%)"/>
      <stop offset="100%" stop-color="hsl(22,70%,50%)"/>
    </linearGradient>
    <linearGradient id="bronzeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(28,62%,52%)"/>
      <stop offset="100%" stop-color="hsl(22,70%,62%)"/>
    </linearGradient>
  </defs>

  <!-- Plate outer rim -->
  <circle cx="200" cy="200" r="178" fill="none" stroke="url(#bronze)" stroke-width="6"/>

  <!-- Plate inner rim -->
  <circle cx="200" cy="200" r="152" fill="none" stroke="url(#bronzeLight)" stroke-width="2.5" stroke-dasharray="0"/>

  <!-- Plate well (subtle fill) -->
  <circle cx="200" cy="200" r="148" fill="hsl(38,28%,96%)" opacity="0.6"/>

  <!-- Letter P — italic, Cormorant-style, centered -->
  <text
    x="200"
    y="260"
    font-family="Cormorant Garamond, Georgia, serif"
    font-size="200"
    font-style="italic"
    font-weight="600"
    text-anchor="middle"
    fill="url(#bronze)"
  >P</text>
</svg>
