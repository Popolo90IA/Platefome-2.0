<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulation Animations</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: hsl(38,28%,94%); font-family: 'DM Sans', sans-serif; overflow-x: hidden; }

/* ── OPTION A — Rideau ── */
.demo { position: relative; height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; border-bottom: 2px solid hsl(28,62%,42%); overflow: hidden; }
.label { position: absolute; top: 20px; right: 20px; background: hsl(28,62%,42%); color: #fff; padding: 6px 14px; border-radius: 99px; font-size: .8rem; font-weight: 600; letter-spacing: .06em; z-index: 20; }

/* Rideau */
.curtain {
  position: absolute; inset: 0; background: hsl(28,22%,14%);
  transform-origin: top;
  animation: curtainUp 1.1s cubic-bezier(.76,0,.24,1) .3s forwards;
  z-index: 10;
}
@keyframes curtainUp {
  from { transform: scaleY(1); }
  to   { transform: scaleY(0); }
}
.a-title {
  font-family: 'Cormorant Garamond', serif; font-size: 5rem; font-weight: 700;
  color: hsl(24,18%,16%); line-height: .9; text-align: center;
  animation: fadeUp .8s cubic-bezier(.16,1,.3,1) 1.2s both;
}
.a-sub {
  font-family: 'Cormorant Garamond', serif; font-size: 3.5rem; font-weight: 700; font-style: italic;
  background: linear-gradient(135deg, hsl(28,62%,42%), hsl(22,70%,50%));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  animation: fadeUp .8s cubic-bezier(.16,1,.3,1) 1.45s both;
}
.a-btn {
  margin-top: 8px; padding: 12px 28px; background: linear-gradient(135deg, hsl(28,62%,38%), hsl(22,70%,50%));
  border: none; border-radius: 10px; color: #fff; font-size: .95rem; font-weight: 600; cursor: pointer;
  animation: fadeUp .8s cubic-bezier(.16,1,.3,1) 1.7s both;
}

/* ── OPTION B — Fade + Scale ── */
.b-title {
  font-family: 'Cormorant Garamond', serif; font-size: 5rem; font-weight: 700;
  color: hsl(24,18%,16%); line-height: .9; text-align: center;
  animation: scaleReveal 1.2s cubic-bezier(.16,1,.3,1) .2s both;
}
@keyframes scaleReveal {
  from { opacity: 0; transform: scale(1.12); filter: blur(12px); }
  to   { opacity: 1; transform: scale(1);    filter: blur(0); }
}
.b-sub {
  font-family: 'Cormorant Garamond', serif; font-size: 3.5rem; font-weight: 700; font-style: italic;
  background: linear-gradient(135deg, hsl(28,62%,42%), hsl(22,70%,50%));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  animation: scaleReveal 1.2s cubic-bezier(.16,1,.3,1) .5s both;
}
.b-btn {
  margin-top: 8px; padding: 12px 28px; background: linear-gradient(135deg, hsl(28,62%,38%), hsl(22,70%,50%));
  border: none; border-radius: 10px; color: #fff; font-size: .95rem; font-weight: 600; cursor: pointer;
  animation: scaleReveal 1.2s cubic-bezier(.16,1,.3,1) .8s both;
}

/* ── OPTION C — Ligne + Chute ── */
.line-expand {
  width: 0; height: 2px; background: linear-gradient(90deg, hsl(28,62%,42%), hsl(22,70%,50%));
  animation: expandLine .8s cubic-bezier(.16,1,.3,1) .1s forwards;
  margin-bottom: 32px;
}
@keyframes expandLine {
  from { width: 0; opacity: 0; }
  to   { width: 340px; opacity: 1; }
}
.c-title {
  font-family: 'Cormorant Garamond', serif; font-size: 5rem; font-weight: 700;
  color: hsl(24,18%,16%); line-height: .9; text-align: center;
  animation: dropIn .7s cubic-bezier(.34,1.56,.64,1) .7s both;
}
@keyframes dropIn {
  from { opacity: 0; transform: translateY(-60px) skewX(-3deg); }
  to   { opacity: 1; transform: translateY(0) skewX(0); }
}
.c-sub {
  font-family: 'Cormorant Garamond', serif; font-size: 3.5rem; font-weight: 700; font-style: italic;
  background: linear-gradient(135deg, hsl(28,62%,42%), hsl(22,70%,50%));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  animation: dropIn .7s cubic-bezier(.34,1.56,.64,1) .95s both;
}
.c-btn {
  margin-top: 8px; padding: 12px 28px; background: linear-gradient(135deg, hsl(28,62%,38%), hsl(22,70%,50%));
  border: none; border-radius: 10px; color: #fff; font-size: .95rem; font-weight: 600; cursor: pointer;
  animation: dropIn .7s cubic-bezier(.34,1.56,.64,1) 1.2s both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(40px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Replay buttons */
.replay { position: absolute; bottom: 20px; left: 20px; background: hsl(28,10%,70%); border: none; padding: 6px 14px; border-radius: 8px; font-size: .75rem; cursor: pointer; z-index: 20; }
</style>
</head>
<body>

<!-- OPTION A — Rideau -->
<div class="demo" id="demoA">
  <div class="label">A — Rideau cinéma</div>
  <div class="curtain" id="curtainA"></div>
  <div class="a-title">תפריט שגורם</div>
  <div class="a-sub">ללקוחות להזמין יותר</div>
  <button class="a-btn">התחל בחינם ←</button>
  <button class="replay" onclick="replayA()">↺ Replay</button>
</div>

<!-- OPTION B — Fade Scale -->
<div class="demo" id="demoB">
  <div class="label">B — Fade + Scale + Blur</div>
  <div class="b-title">תפריט שגורם</div>
  <div class="b-sub">ללקוחות להזמין יותר</div>
  <button class="b-btn">התחל בחינם ←</button>
  <button class="replay" onclick="replayB()">↺ Replay</button>
</div>

<!-- OPTION C — Ligne + Chute -->
<div class="demo" id="demoC">
  <div class="label">C — Ligne + Chute élastique</div>
  <div class="line-expand" id="lineC"></div>
  <div class="c-title">תפריט שגורם</div>
  <div class="c-sub">ללקוחות להזמין יותר</div>
  <button class="c-btn">התחל בחינם ←</button>
  <button class="replay" onclick="replayC()">↺ Replay</button>
</div>

<script>
function replayA() {
  const d = document.getElementById('demoA');
  d.innerHTML = d.innerHTML;
  // re-inject
  d.innerHTML = `
    <div class="label">A — Rideau cinéma</div>
    <div class="curtain"></div>
    <div class="a-title">תפריט שגורם</div>
    <div class="a-sub">ללקוחות להזמין יותר</div>
    <button class="a-btn">התחל בחינם ←</button>
    <button class="replay" onclick="replayA()">↺ Replay</button>`;
}
function replayB() {
  const d = document.getElementById('demoB');
  d.innerHTML = `
    <div class="label">B — Fade + Scale + Blur</div>
    <div class="b-title">תפריט שגורם</div>
    <div class="b-sub">ללקוחות להזמין יותר</div>
    <button class="b-btn">התחל בחינם ←</button>
    <button class="replay" onclick="replayB()">↺ Replay</button>`;
}
function replayC() {
  const d = document.getElementById('demoC');
  d.innerHTML = `
    <div class="label">C — Ligne + Chute élastique</div>
    <div class="line-expand"></div>
    <div class="c-title">תפריט שגורם</div>
    <div class="c-sub">ללקוחות להזמין יותר</div>
    <button class="c-btn">התחל בחינם ←</button>
    <button class="replay" onclick="replayC()">↺ Replay</button>`;
}
</script>
</body>
</html>
